<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 洞察 - 蜜雪冰城 VOC</title>
  <link rel="stylesheet" href="./ai_insights.css?v=20260606h">
</head>
<body>
  <div class="agent-shell">
    <aside class="conversation-sidebar">
      <div class="sidebar-actions">
        <button id="newConversation" class="new-conversation"><span>＋</span>新建对话</button>
        <button id="collapseConversation" class="collapse-conversation" aria-label="收起历史会话">‹</button>
      </div>
      <div class="history-title">历史会话</div>
      <div id="historyList" class="conversation-history"></div>
    </aside>

    <main class="agent-main">
      <section id="agentHome" class="agent-home">
        <div class="mode-tabs" role="tablist">
          <button class="mode-tab active" data-mode="chat">即时问答</button>
          <button class="mode-tab" data-mode="research">深度研究</button>
        </div>

        <section class="prompt-box">
          <textarea id="questionInput" placeholder="输入问题，或选择下方指令开始对话..."></textarea>
          <div class="prompt-toolbar">
            <div class="prompt-tools">
              <button type="button">提示词优化</button>
              <button type="button">附件</button>
              <button type="button">☷ 数据源</button>
              <span class="smart-match">智能匹配</span>
            </div>
            <button id="sendQuestion" class="send-button" aria-label="发送">➤</button>
          </div>
        </section>

        <section id="chatModeContent" class="template-library">
          <div class="library-toolbar">
            <div class="library-tabs">
              <button class="active">全部</button><button>我的</button><button>官方</button><button>推荐</button>
            </div>
            <div class="library-actions">
              <button class="new-command">新建指令</button>
              <label class="command-search"><input placeholder="搜索问题指令..."><span>⌕</span></label>
            </div>
          </div>
          <div class="command-grid">
            <button class="command-card" data-question="近 7 天外卖评价中最需要关注的问题是什么？">
              <div><span class="official">官方</span><span>外卖体验</span></div>
              <h3>近 7 天外卖评价中最需要关注的问题是什么？</h3>
              <p>从问题量、强负向、门店覆盖及风险标签识别当前优先事项。</p>
              <small>使用 420</small>
            </button>
            <button class="command-card" data-question="哪些客诉问题正在从内部渠道向社媒外溢？">
              <div><span class="official">官方</span><span>风险监测</span></div>
              <h3>哪些客诉问题正在从内部渠道向社媒外溢？</h3>
              <p>对比热线、在线客服、外卖评价与社媒负向趋势。</p>
              <small>使用 457</small>
            </button>
            <button class="command-card" data-question="薄荷新品的正负面口碑差异是什么？">
              <div><span class="official">官方</span><span>新品口碑</span></div>
              <h3>薄荷新品的正负面口碑差异是什么？</h3>
              <p>拆解平台声量、情感结构、证据词与消费者原声。</p>
              <small>使用 494</small>
            </button>
            <button class="command-card" data-question="哪些区域的食安风险需要优先排查？">
              <div><span class="recommended">推荐</span><span>区域归因</span></div>
              <h3>哪些区域的食安风险需要优先排查？</h3>
              <p>按省份、城市和门店识别高风险问题集中区域。</p>
              <small>使用 531</small>
            </button>
          </div>

          <div class="report-template-heading">
            <div><h2>报告模板</h2><p>选择模板后配置参数，生成对应的业务分析报告。</p></div>
            <span>固定模板 · 3</span>
          </div>
          <div class="report-template-grid">
            <button data-template="mint"><span class="mint-tag">新品口碑</span><h3>新品口碑报告</h3><p>时间、平台、关键词</p></button>
            <button data-template="delivery"><span class="delivery-tag">外卖体验</span><h3>外卖评价分析</h3><p>平台、区域、问题、情感、时间、主体</p></button>
            <button data-template="complaint"><span class="complaint-tag">客诉风险</span><h3>客诉分析报告</h3><p>周期、情感、平台、区域、问题维度</p></button>
          </div>
        </section>

        <section id="researchModeContent" class="research-mode" hidden>
          <div class="research-heading">
            <span>框架式分析</span>
            <h2>选择报告框架，系统按固定步骤完成研究</h2>
            <p>定义研究范围 → 拆解趋势与问题 → 关联关键词和原声 → 生成报告。</p>
          </div>
          <div class="research-templates">
            <button data-template="mint"><b>01</b><strong>新品口碑分析框架</strong><span>声量、情感、渠道、口碑证据</span></button>
            <button data-template="delivery"><b>02</b><strong>外卖体验分析框架</strong><span>问题结构、区域门店、消费者原声</span></button>
            <button data-template="complaint"><b>03</b><strong>全渠道客诉框架</strong><span>内外趋势、外溢风险、归因证据</span></button>
          </div>
        </section>
      </section>

      <section id="conversationWorkspace" class="conversation-workspace" hidden>
        <div class="thread-panel">
          <div id="threadMessages" class="thread-messages"></div>
          <form id="followupForm" class="followup-box">
            <textarea id="followupInput" placeholder="围绕当前报告继续追问，例如：只看华南区域的差异..."></textarea>
            <button type="submit" aria-label="发送追问">➤</button>
          </form>
        </div>
        <section class="preview-panel">
          <header>
            <div><strong id="previewTitle">报告预览</strong><span id="previewMeta">历史报告</span></div>
            <div><a id="downloadReport" href="#" target="_blank">下载报告</a><a id="fullscreenReport" href="#" target="_blank">全屏预览</a></div>
          </header>
          <iframe id="reportPreview" title="报告预览"></iframe>
        </section>
      </section>
    </main>
  </div>

  <div id="configMask" class="config-mask" hidden></div>
  <aside id="configPanel" class="config-panel" aria-hidden="true">
    <header><div><span>报告模板</span><h2 id="configTitle">参数配置</h2></div><button id="closeConfig">×</button></header>
    <p id="configDescription"></p>
    <form id="configForm"></form>
    <footer><button id="cancelConfig" type="button">取消</button><button id="generateReport" type="button">生成报告</button></footer>
    <div id="generateStatus" class="generate-status" hidden></div>
  </aside>
  <script src="./ai_insights.js?v=20260606h"></script>
</body>
</html>
